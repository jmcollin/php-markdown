## 6. Code Blocks

### Fenced block — PHP

```php
&lt;?php
declare(strict_types=1);

use PhpMarkdown\MarkdownParser;

$parser = new MarkdownParser();
$html   = $parser->parse('# Hello **World**');
echo $html;
```

### Fenced block — JavaScript

```js
const res = await fetch('/render', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ markdown: input }),
});
const { html } = await res.json();
```

## 12. Footnotes

CommonMark[^cm] is the reference specification for Markdown.

Footnotes support multiple references to the same note[^multi] — even repeated[^multi].

[^cm]: [CommonMark Spec](https://spec.commonmark.org) — the authoritative Markdown standard.
[^multi]: This footnote is referenced twice above, generating two back-links.

```php

<!-- allow-scripts: required for Mermaid.js to execute inside srcdoc.
     No allow-same-origin: sandboxed iframe gets an opaque origin, preventing access to
     window.parent and parent DOM. Safe for script execution of the vendored Mermaid.js.
     The vendor script is served with Access-Control-Allow-Origin:* (.htaccess) so SRI
     enforcement works from the opaque-origin frame. -->
<iframe id="preview" sandbox="allow-scripts"></iframe>
<button type="submit" id="submit-btn">Render</button>
</form>
<script>
(function () {
  var btn = document.getElementById('submit-btn');
  btn.style.display = 'none';

  var input = document.getElementById('md-input');
  var preview = document.getElementById('preview');
  var errorMsg = document.getElementById('error-msg');
  var timer = null;

  // Mermaid 11.14.0 — vendored at /vendor/mermaid.min.js (no CDN dependency).
  // SRI hash: PowerShell SHA384 on the downloaded artifact — bump version + hash together.
  //   [System.Security.Cryptography.SHA384]::Create().ComputeHash(file_bytes) | base64
  // securityLevel:'strict' required (CVE-2021-43119; never use 'loose').
  // <base href="/"> resolves /vendor/... relative to server root inside srcdoc.
  var MERMAID_SNIPPET =
    '<base href="/">' +
    '<script src="/vendor/mermaid.min.js"' +
    ' integrity="sha384-1CMXl090wj8Dd6YfnzSQUOgWbE6suWCaenYG7pox5AX7apTpY3PmJMeS2oPql4Gk"' +
    ' crossorigin="anonymous"><\/script>' +
    '<script>if(typeof mermaid!=="undefined"){' +
    'mermaid.initialize({startOnLoad:true,securityLevel:"strict"});' +
    '}<\/script>';

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  function hideError() {
    errorMsg.style.display = 'none';
  }

  function render(value) {
    fetch('/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ markdown: value })
    })
      .then(function (res) {
        if (res.ok) {
          return res.json().then(function (data) {
            hideError();
            preview.srcdoc = MERMAID_SNIPPET + data.html;
          });
        }
        if (res.status === 413) {
          showError('Input too large (max 64 KB).');
        } else {
          showError('Render failed (HTTP ' + res.status + ').');
        }
      })
      .catch(function () {
        showError('Could not reach the render server. Is the playground running?');
      });
  }

  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      render(input.value);
    }, 400);
  });

  render(input.value);
}());
</script>
